<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gitty Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #000000;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(26, 26, 26, 0.95);
      border-bottom: 1px solid #1a1a1a;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    button {
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid #1a1a1a;
      color: #ffffff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    button:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.02);
    }

    button.primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    button.primary:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background: rgba(26, 26, 26, 0.5);
      border-right: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .sidebar-title {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #808080;
      margin-bottom: 0.75rem;
    }

    .new-post-btn {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid #1a1a1a;
      color: #ffffff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .new-post-btn:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.02);
    }

    .posts-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .post-item {
      padding: 0.75rem;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }

    .post-item:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: #1a1a1a;
    }

    .post-item.active {
      background: rgba(255, 255, 255, 0.05);
      border-color: #ffffff;
    }

    .post-filename {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      color: #ffffff;
    }

    .post-date {
      font-size: 0.75rem;
      color: #808080;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-tabs {
      display: flex;
      background: rgba(26, 26, 26, 0.5);
      border-bottom: 1px solid #1a1a1a;
      padding: 0 1rem;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #808080;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #ffffff;
    }

    .tab.active {
      color: #ffffff;
      border-bottom-color: #ffffff;
    }

    .editor-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1a1a1a;
    }

    .editor-pane:last-child {
      border-right: none;
    }

    .pane-header {
      padding: 0.75rem 1rem;
      background: rgba(26, 26, 26, 0.3);
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #808080;
    }

    textarea {
      flex: 1;
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 1.5rem;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .preview {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: #000000;
    }

    .preview-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .preview-content h1,
    .preview-content h2,
    .preview-content h3 {
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .preview-content h1 {
      font-size: 2rem;
    }

    .preview-content h2 {
      font-size: 1.5rem;
    }

    .preview-content h3 {
      font-size: 1.25rem;
    }

    .preview-content p {
      margin-bottom: 1rem;
      line-height: 1.75;
    }

    .preview-content code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.125rem 0.375rem;
      border-radius: 2px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.875em;
    }

    .preview-content pre {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    .preview-content pre code {
      background: transparent;
      padding: 0;
    }

    .preview-content a {
      color: #ffffff;
      text-decoration: underline;
    }

    .preview-content ul,
    .preview-content ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .preview-content li {
      margin-bottom: 0.5rem;
    }

    .preview-content blockquote {
      border-left: 3px solid #ffffff;
      padding-left: 1rem;
      margin-left: 0;
      margin-bottom: 1rem;
      color: #b3b3b3;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #808080;
      text-align: center;
      padding: 2rem;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .empty-state-text {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .empty-state-hint {
      font-size: 0.875rem;
      color: #666666;
    }

    .settings-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-content {
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      padding: 2rem;
      width: 500px;
      max-width: 90vw;
    }

    .settings-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      color: #808080;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      color: #ffffff;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .form-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .status-bar {
      padding: 0.5rem 1rem;
      background: rgba(26, 26, 26, 0.5);
      border-top: 1px solid #1a1a1a;
      font-size: 0.75rem;
      color: #808080;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicator {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #808080;
    }

    .status-indicator.saved {
      background: #00ff00;
    }

    .status-indicator.unsaved {
      background: #ff0000;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Gitty Editor</div>
    <div class="header-actions">
      <button id="settings-btn">Settings</button>
      <button id="upload-btn" class="primary">Upload to GitHub</button>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Posts</div>
        <button class="new-post-btn" id="new-post-btn">+ New Post</button>
      </div>
      <div class="posts-list" id="posts-list">
        <div class="empty-state">
          <div class="empty-state-text">No posts found</div>
          <div class="empty-state-hint">Click "New Post" to create one</div>
        </div>
      </div>
    </div>

    <div class="editor-container" id="editor-container">
      <div class="empty-state">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-text">Select a post to edit</div>
        <div class="empty-state-hint">Or create a new one</div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="status-indicator" id="status-indicator"></div>
      <span id="status-text">Ready</span>
    </div>
    <div id="char-count">0 characters</div>
  </div>

  <div class="settings-modal" id="settings-modal">
    <div class="settings-content">
      <div class="settings-title">Settings</div>
      <div class="form-group">
        <label class="form-label">GitHub Repository</label>
        <input type="text" class="form-input" id="config-repo" placeholder="owner/repo">
      </div>
      <div class="form-group">
        <label class="form-label">GitHub Token</label>
        <input type="password" class="form-input" id="config-token" placeholder="ghp_...">
      </div>
      <div class="form-group">
        <label class="form-label">Branch</label>
        <input type="text" class="form-input" id="config-branch" value="main" placeholder="main">
      </div>
      <div class="form-actions">
        <button id="settings-cancel">Cancel</button>
        <button id="settings-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div class="settings-modal" id="new-post-modal">
    <div class="settings-content">
      <div class="settings-title">New Post</div>
      <div class="form-group">
        <label class="form-label">Post Title</label>
        <input type="text" class="form-input" id="new-post-title" placeholder="Enter post title" autofocus>
      </div>
      <div class="form-actions">
        <button id="new-post-cancel">Cancel</button>
        <button id="new-post-create" class="primary">Create</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
